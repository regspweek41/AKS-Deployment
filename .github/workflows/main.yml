name: Deploy to GKE

on:
  push:
    branches:
      - main
      - feature/gcp-pipeline
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-to-gke.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  DEPLOYMENT_NAME: todo-rest-api
  IMAGE_NAME: todo-rest-api
  REGISTRY_HOSTNAME: us-west3-docker.pkg.dev
  REPO: demo
  

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Java application
        run: |
          cd backend-java
          mvn clean package -DskipTests
            
      - name: SAST scan - Semgrep OSS
        run: |
          python -m pip install semgrep
          semgrep scan \
          --config p/java \
          --config p/owasp-top-ten \
          --config p/security-audit \
          --error \
          backend-java
      - name: SCA scan - OWASP Dependency Check
        run: |
          cd backend-java
          mvn org.owasp:dependency-check-maven:check -DskipTests

      - name: Verify build output
        run: |
          echo "Listing target folder..."
          ls -R backend-java/target

      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY_HOSTNAME }}

      - name: Build and push Docker image to GCR
        run: |
          docker build -f backend-java/Dockerfile -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                       -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:latest backend-java
          docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:latest

      - name: Generate SBOM - Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Update Kubernetes deployment with new image
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.DEPLOYMENT_NAME }}=${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n default \
            --record

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n default --timeout=5m

      - name: Check deployment status
        run: |
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n default
          kubectl get pods -n default -l app=todo-rest-api

      - name: Verify service endpoints
        run: |
          kubectl get svc -n default
          kubectl describe svc ${{ env.DEPLOYMENT_NAME }} -n default || echo "Service not found, checking for loadbalancer..."

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to GKE successful!"
            echo "Deployed image: ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          else
            echo "❌ Deployment to GKE failed!"
            exit 1
          fi
