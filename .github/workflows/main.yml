name: Deploy to GKE

on:
  push:
    branches:
      - main
      - feature/gcp-pipeline
    paths:
      - 'backend-java/**'
      - 'k8s/**'
      - 'scripts/**'
      - '.github/workflows/deploy-to-gke.yaml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

  APP_NAME: todo-rest-api
  DEPLOYMENT_NAME: todo-rest-api
  CONTAINER_NAME: todo-rest-api
  IMAGE_NAME: todo-rest-api
  NAMESPACE: default

  REGISTRY_HOSTNAME: us-west3-docker.pkg.dev
  REPO: demo

  APP_SOURCE_DIR: backend-java
  DOCKERFILE_PATH: backend-java/Dockerfile
  K8S_MANIFEST_DIR: k8s

  RISK_THRESHOLD: "70"
  HEALTH_THRESHOLD: "70"
  ENABLE_AUTO_ROLLBACK: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_URI: us-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo/todo-rest-api:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Java application
        run: |
          cd $APP_SOURCE_DIR
          mvn clean package -DskipTests

      - name: SAST scan - Semgrep OSS
        continue-on-error: true
        run: |
          python -m pip install semgrep
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --json \
            --output semgrep-report.json \
            $APP_SOURCE_DIR || true

      - name: SCA scan - OWASP Dependency Check
        continue-on-error: true
        run: |
          cd $APP_SOURCE_DIR
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DskipTests || true

      - name: Verify build output
        run: |
          echo "Listing target folder..."
          ls -R $APP_SOURCE_DIR/target

      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker $REGISTRY_HOSTNAME --quiet

      - name: Build and push Docker image to Artifact Registry
        run: |
          docker build \
            -f $DOCKERFILE_PATH \
            -t $IMAGE_URI \
            $APP_SOURCE_DIR

          docker push $IMAGE_URI

      - name: Generate SBOM - Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_URI }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign
        run: |
          cosign sign --yes $IMAGE_URI

      - name: Verify Cosign signature
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "https://github.com/.+/.github/workflows/.+@refs/heads/.+" \
            $IMAGE_URI

      - name: Install AIOps dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes YAML files..."

          if [ ! -d "$K8S_MANIFEST_DIR" ]; then
            echo "❌ Kubernetes manifest directory not found: $K8S_MANIFEST_DIR"
            exit 1
          fi

          find $K8S_MANIFEST_DIR -name "*.yaml" -o -name "*.yml"

          echo "✅ Kubernetes manifest files detected"

      - name: AIOps pre-deployment risk analysis
        env:
          RISK_THRESHOLD: ${{ env.RISK_THRESHOLD }}
          K8S_MANIFEST_DIR: ${{ env.K8S_MANIFEST_DIR }}
        run: |
          echo "======================================="
          echo "Running Enterprise AIOps Risk Analysis"
          echo "======================================="

          python scripts/generic-aiops-risk-gate.py

      - name: Display AIOps risk analysis
        if: always()
        run: |
          echo "======================================="
          echo "AIOps Risk Analysis Report"
          echo "======================================="

          if [ -f risk-score.txt ]; then
            echo "Risk Score:"
            cat risk-score.txt
          else
            echo "❌ risk-score.txt missing"
          fi

          echo ""
          echo "Detailed Report:"
          echo "---------------------------------------"

          if [ -f aiops-risk-report.json ]; then
            cat aiops-risk-report.json
          else
            echo "❌ aiops-risk-report.json missing"
          fi

      - name: Upload AIOps risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiops-risk-report-${{ github.sha }}
          path: |
            risk-score.txt
            aiops-risk-report.json
          if-no-files-found: ignore

      - name: Block unsafe deployment
        run: |
          echo "======================================="
          echo "Enterprise AIOps Deployment Gate"
          echo "======================================="

          if [ ! -f risk-score.txt ]; then
            echo "❌ risk-score.txt not found"
            echo "Blocking deployment due to missing risk analysis"
            exit 1
          fi

          RISK_SCORE=$(cat risk-score.txt)

          echo "AIOps Risk Score: $RISK_SCORE"
          echo "Risk Threshold: $RISK_THRESHOLD"

          if [ "$RISK_SCORE" -ge "$RISK_THRESHOLD" ]; then
            echo "❌ Deployment blocked by AIOps risk gate"
            exit 1
          fi

          echo "✅ AIOps risk gate passed"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE \
            --project $PROJECT_ID

      - name: Update Kubernetes deployment with new image
        run: |
          kubectl set image deployment/$DEPLOYMENT_NAME \
            $CONTAINER_NAME=$IMAGE_URI \
            -n $NAMESPACE

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME \
            -n $NAMESPACE \
            --timeout=5m

      - name: Agentic AI post-deployment health analysis
        run: |
          python scripts/generic-agentic-health-check.py

      - name: Agentic rollback decision
        if: failure()
        run: |
          if [ "$ENABLE_AUTO_ROLLBACK" = "true" ]; then
            echo "❌ Agentic health check failed. Rolling back..."
            kubectl rollout undo deployment/$DEPLOYMENT_NAME -n $NAMESPACE
            kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE --timeout=5m
          else
            echo "⚠️ Health check failed, but auto rollback is disabled"
            exit 1
          fi

      - name: Check deployment status
        if: always()
        run: |
          kubectl get deployment $DEPLOYMENT_NAME -n $NAMESPACE || true
          kubectl get pods -n $NAMESPACE -l app=$APP_NAME || true
          kubectl get svc -n $NAMESPACE || true

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-aiops-reports-${{ github.sha }}
          path: |
            semgrep-report.json
            sbom.json
            risk-score.txt
            aiops-risk-report.json
            agentic-health-report.json
            backend-java/target/dependency-check-report.json
          if-no-files-found: ignore

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment to GKE successful!"
            echo "Deployed image: $IMAGE_URI"
          else
            echo "❌ Deployment to GKE failed!"
            exit 1
          fi
